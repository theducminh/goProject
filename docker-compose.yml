services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.grpc.address=:9090
      - --api.dashboard=false
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [warehouse]
    deploy:
      placement:
        constraints: [node.role == manager]

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [warehouse]
    deploy:
      restart_policy:
        condition: on-failure

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes: [redisdata:/data]
    networks: [warehouse]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ES_PASSWORD:?ES_PASSWORD is required}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [esdata:/usr/share/elasticsearch/data]
    networks: [warehouse]

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes: [kafkadata:/bitnami/kafka]
    networks: [warehouse]

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      PORT: ${PORT:-8080}
      GRPC_PORT: ${GRPC_PORT:-9090}
      GIN_MODE: ${GIN_MODE:?GIN_MODE is required}
      DB_HOST: postgres-db
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_PORT: "5432"
      ES_ADDRESS: ${ES_ADDRESS:?ES_ADDRESS is required}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:?ES_PASSWORD is required}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      KAFKA_BROKERS: ${KAFKA_BROKERS:?KAFKA_BROKERS is required}
      KAFKA_TLS: ${KAFKA_TLS:?KAFKA_TLS is required}
      KAFKA_ORDER_TOPIC: ${KAFKA_ORDER_TOPIC:-warehouse.order.created}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-warehouse-service}
    networks: [warehouse]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.warehouse.rule=PathPrefix(`/`)
        - traefik.http.routers.warehouse.entrypoints=web
        - traefik.http.services.warehouse.loadbalancer.server.port=8080
        - traefik.tcp.routers.warehouse-grpc.entrypoints=grpc
        - traefik.tcp.routers.warehouse-grpc.rule=HostSNI(`*`)
        - traefik.tcp.services.warehouse-grpc.loadbalancer.server.port=9090

volumes:
  pgdata:
  redisdata:
  esdata:
  kafkadata:

networks:
  warehouse:
    driver: overlay
    attachable: true